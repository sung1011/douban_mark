  <p id="dialog" class="note">若此处出现「添加收藏：修改」，说明错误地打开了原生对话框。</p>

  <script>
    var abstractStore = {
      '1292052': '',
      '1291546': 'collect',
      '37068446': '',
      '36439868': 'wish',
      '35278770': '',
      '1292722': ''
    };

    var nativeFetch = window.fetch.bind(window);
    window.fetch = function (url, options) {
      var href = String(url);
      var id;
      var abs = href.match(/subject_abstract\?subject_id=(\d+)/);
      if (abs) {
        id = abs[1];
        return Promise.resolve(new Response(JSON.stringify({
          r: 0,
          subject: { id: id, collection_status: abstractStore[id] || '' }
        }), { status: 200, headers: { 'Content-Type': 'application/json' } }));
      }
      var interest = href.match(/\/j\/subject\/(\d+)\/interest/);
      if (interest) {
        id = interest[1];
        var body = (options && options.body) || '';
        if (String(body).indexOf('interest=collect') === -1) {
          return Promise.resolve(new Response(JSON.stringify({ r: 1, msg: 'bad body' }), { status: 200 }));
        }
        if (String(body).indexOf('ck=') === -1) {
          return Promise.resolve(new Response(JSON.stringify({ r: 1, msg: 'no ck' }), { status: 200 }));
        }
        abstractStore[id] = 'collect';
        return Promise.resolve(new Response(JSON.stringify({ r: 0, interest_status: 'collect' }), { status: 200 }));
      }
      return nativeFetch(url, options);
    };

    document.cookie = 'ck=test';
  </script>
  <script src="../markCore.js"></script>
  <script src="../content.js"></script>
  <script>
    (function () {
      function snapshot() {
        return {
          count: document.querySelectorAll('.doubanMarkBadge').length,
          unwatched: document.querySelectorAll('.doubanMarkBadge.isUnwatched').length,
          watched: document.querySelectorAll('.doubanMarkBadge.isWatched').length,
          error: document.querySelectorAll('.doubanMarkBadge.isError').length,
          dialog: (document.getElementById('dialog') || {}).textContent || ''
        };
      }
      window.addEventListener('load', function () {
        window.setTimeout(function () {
          var before = snapshot();
          var target = document.querySelector('.doubanMarkBadge.isUnwatched');
          if (target) target.click();
          window.setTimeout(function () {
            var after = snapshot();
            var out = document.createElement('pre');
            out.id = 'autoResult';
            out.textContent = JSON.stringify({ before: before, after: after });
            document.body.appendChild(out);
          }, 200);
        }, 200);
      });
    })();
  </script>
