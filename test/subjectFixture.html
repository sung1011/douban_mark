<!DOCTYPE html>
<html lang="zh-CN" data-douban-mark-fixture="1">
<head>
  <meta charset="utf-8">
  <title>豆瓣收藏角标 - 本地夹具</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    body { font: 14px/1.5 sans-serif; margin: 24px; background: #f6f6f1; }
    #mainpic { width: 135px; height: 200px; background: #ccc; }
    #mainpic img { display: block; width: 135px; height: 200px; background: #8a8a8a; }
    #interest_sect_level { margin-top: 16px; }
    #interest_sect_level a { margin-right: 8px; }
    #dialog { display: none; margin-top: 20px; padding: 12px; background: #fff; border: 1px solid #ccc; width: 320px; }
    #dialog.open { display: block; }
    .note { color: #666; max-width: 40em; }
  </style>
</head>
<body>
  <p class="note">本地夹具：模拟条目页封面与收藏按钮。点击角标应打开下方对话框，而不是发 POST。</p>

  <div id="mainpic" class="">
    <a class="nbgnbg" href="#photos" title="点击看更多海报">
      <img alt="夹具海报" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
    </a>
  </div>

  <div id="interest_sect_level" class="clearfix">
    <a href="#wish" rel="nofollow" class="j a_show_login colbutt ll" name="pbtn-1292052-wish"><span>想看</span></a>
    <a href="#collect" rel="nofollow" class="j a_collect_btn collect_btn colbutt ll" name="pbtn-1292052-collect"><span>看过</span></a>
  </div>

  <div id="dialog"></div>

  <script>
    window.jQuery = window.$ = function (el) {
      return {
        trigger: function () {
          if (el && typeof el.click === 'function') el.click();
        }
      };
    };

    document.addEventListener('click', function (event) {
      var t = event.target.closest('a');
      if (!t || t.getAttribute('name') !== 'pbtn-1292052-collect') return;
      event.preventDefault();
      var dialog = document.getElementById('dialog');
      dialog.className = 'open';
      dialog.style.display = 'block';
      dialog.style.width = '320px';
      dialog.innerHTML = '<h2>添加收藏：修改</h2><p>评分 / 短评 / 状态（豆瓣原生 UI 占位）</p>';
    });
  </script>
  <script src="../collectTarget.js"></script>
  <script src="../pageBridge.js"></script>
  <script src="../content.js"></script>
</body>
</html>
